name: Browser Runner Policy

on:
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check all browser workflow runners
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --index-url https://pypi.org/simple PyYAML==6.0.3
      - name: Check every workflow and run regression tests
        run: |
          python scripts/check_browser_runners.py
          python -m unittest discover -s scripts/tests -p 'test_check_browser_runners.py'
