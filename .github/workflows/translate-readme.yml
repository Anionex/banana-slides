name: Sync README translations

on:
  push:
    branches: [main]
    paths:
      - 'README*.md'
      - 'docs/i18n/**'
      - 'scripts/translate_readme*.py'
      - 'scripts/generate_readme_buttons.mjs'
      - 'scripts/render_readme_hero.py'
      - '.github/workflows/translate-readme.yml'
  pull_request:
    paths:
      - 'README*.md'
      - 'docs/i18n/**'
      - 'scripts/translate_readme*.py'
      - 'scripts/tests/test_readme_i18n.py'
      - 'scripts/generate_readme_buttons.mjs'
      - 'assets/buttons/**'
      - 'assets/readme/**'
      - 'scripts/render_readme_hero.py'
      - '.github/workflows/translate-readme.yml'
  workflow_dispatch:

# Finish each sync; the next queued run checks out the latest main.
concurrency:
  group: readme-i18n-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s scripts/tests -p 'test_readme_i18n.py'
      - run: node scripts/generate_readme_buttons.mjs --check
      # Source changes may legitimately await translation. No API/secrets on PRs.
      - run: python scripts/translate_readme_incremental.py --plan

  translate:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate language buttons
        run: node scripts/generate_readme_buttons.mjs
      - name: Translate changed sections
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_BASE: ${{ secrets.GOOGLE_API_BASE }}
          TEXT_MODEL: gemini-3-flash-preview
        run: uv run --no-project scripts/translate_readme_incremental.py
      - name: Assemble localized README heroes
        run: python3 scripts/render_readme_hero.py
      - name: Verify completed sync offline
        run: |
          python3 scripts/translate_readme_incremental.py --check
          node scripts/generate_readme_buttons.mjs --check
          python3 scripts/render_readme_hero.py --check
          # Markdown hard breaks and protected source code may contain trailing spaces.
          git -c core.whitespace=-blank-at-eol diff --check
      - name: Commit complete translations and source snapshots together
        run: |
          git add README.md README_*.md docs/i18n/readme-state.json assets/buttons/ assets/readme/
          if git diff --cached --quiet; then
            echo "README translations are already up to date."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "文档：增量同步多语言 README 与翻译状态"
          # Reject concurrent upstream edits; never rebase stale generated translations.
          git push origin HEAD:main
